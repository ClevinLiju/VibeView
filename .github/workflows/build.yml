name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # Windows: portable Swift core + vibeview-engine.exe, Electron front end, NSIS installer.
  # See docs/WINDOWS.md. Local equivalent: scripts\windows\build.ps1
  windows:
    runs-on: windows-latest
    env:
      SWIFT_VERSION: '6.4.3'   # same toolchain as the local Windows builds (winget Swift.Toolchain)
      NODE_VERSION: '22.12.0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Swift
        uses: compnerd/gha-setup-swift@581df1ffa3f3e786ddc73ff37364ee231f9644c5 # v0.3.0
        with:
          branch: swift-${{ env.SWIFT_VERSION }}-release
          tag: ${{ env.SWIFT_VERSION }}-RELEASE
          build_arch: amd64

      - name: Visual Studio developer environment (swift needs MSVC link.exe on PATH)
        run: scripts\windows\vsdevenv.ps1 -ExportGitHubEnv

      - name: Toolchain
        run: |
          swift --version
          Get-Command link.exe -All | ForEach-Object Source
          git config --get core.autocrlf; exit 0

      - name: Cache SwiftPM build
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .build
          key: spm-${{ runner.os }}-swift${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.swift', 'Sources/**') }}
          restore-keys: spm-${{ runner.os }}-swift${{ env.SWIFT_VERSION }}-

      - name: Build
        run: swift build

      - name: Self-checks
        run: swift run molscope-check

      - name: Engine self-test
        run: swift run vibeview-engine --selftest

      - name: Stage engine (release build + runtime DLLs, verified without Swift on PATH)
        run: scripts\windows\stage-engine.ps1 -Configuration release -ScratchPath .build-win

      - name: Set up Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build installer (npm ci + npm run dist)
        run: |
          $version = ''
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF_NAME }
          scripts\windows\build.ps1 -SkipEngine -Version $version

      - name: Upload installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: VibeView-windows
          path: |
            windows/dist/VibeView-Setup-*.exe
            windows/dist/VibeView-*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          setup="$(ls windows/dist/VibeView-Setup-*.exe | head -n 1)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Keep an installer that was already attached by hand; only add it when missing.
            gh release upload "$GITHUB_REF_NAME" "$setup" || echo "Installer already attached; leaving it"
          else
            gh release create "$GITHUB_REF_NAME" "$setup" --generate-notes \
              || gh release upload "$GITHUB_REF_NAME" "$setup" \
              || echo "Installer already attached; leaving it"
          fi
